version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: rhaudit
      POSTGRES_USER: rhaudit
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rhaudit_secure_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhaudit"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rhaudit:${DB_PASSWORD:-rhaudit_secure_2026}@db:5432/rhaudit
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/app/uploads
      - exports:/app/exports
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads:
  exports:
